<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Loader</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; margin: 0; padding: 0; border: 0; background: #000; }
  #notice { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; overflow: auto; background: #080a0f; color: #e8edf5; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center; white-space: pre-wrap; }
  #notice[hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="game" title="Game" sandbox="allow-scripts allow-forms allow-modals allow-popups" allow="fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
<pre id="notice" hidden></pre>
<script>
(() => {
  'use strict';

  // IDs 1–11 stay fixed. IDs 12–15 order: Retro Bowl 2-in-1, Get Yoked,
  // Rolling Sky, Super Mario Construct. Game-specific preparation below
  // matches by path, so reordering IDs does not affect it.
  const KNOWN_GAMES = Object.freeze([
    { id: '1', path: '1on1soccer.html', name: '1-on-1 Soccer' },
    { id: '2', path: 'paperio2.html', name: 'Paper.io 2' },
    { id: '3', path: 'escaperoad3.html', name: 'Escape Road 3' },
    { id: '4', path: 'mausland-sharks.html', name: 'Mausland Sharks' },
    { id: '5', path: 'eaglercraft-26.2-0.5.html', name: 'Eaglercraft 26.2-0.5' },
    { id: '6', path: 'webdashers.html', name: 'Web Dashers' },
    { id: '7', path: 'tinyfishing.html', name: 'Tiny Fishing' },
    { id: '8', path: 'drivemad.html', name: 'Drive Mad' },
    { id: '9', path: 'Sandboxels.html', name: 'Sandboxels', ref: '16b392e12a38a249ad2d2971aca52ef0a2bab3b3' },
    { id: '10', path: 'Google-Block-Breaker.html', name: 'Google Block Breaker' },
    { id: '11', path: 'PolyTrack.html', name: 'PolyTrack' },
    { id: '12', path: 'retro-bowl-collection.html', name: 'Retro Bowl 2-in-1' },
    { id: '13', path: 'Get-Yoked.html', name: 'Get Yoked' },
    { id: '14', path: 'Rolling-Sky.html', name: 'Rolling Sky' },
    { id: '15', path: 'Super-Mario-Construct.html', name: 'Super Mario Construct' }
  ]);
  const REPOSITORY_TREE_API = 'https://api.github.com/repos/k1412483/ubutilsplus-games/git/trees/main?recursive=1';
  const REPOSITORY_RAW_BASE = 'https://raw.githubusercontent.com/k1412483/ubutilsplus-games';
  const REPOSITORY_DEFAULT_REF = 'main';
  const REMOTE_LAUNCHER_PATH = 'loader.html';

  function makeKnownGameCatalog() {
    const catalog = Object.create(null);
    for (const game of KNOWN_GAMES) {
      catalog[game.id] = Object.freeze({ name: game.name, path: game.path, type: 'html', url: gameURLFromPath(game.path, game.ref) });
    }
    return Object.freeze(catalog);
  }

  const BUILT_IN_GAMES = makeKnownGameCatalog();
  let GAMES = BUILT_IN_GAMES;
  const MAX_BUFFER_BYTES = 32 * 1024 * 1024;
  let activeZipSession = null;
  const params = new URLSearchParams(window.location.search);
  const gameFrame = document.getElementById('game');
  const notice = document.getElementById('notice');
  let activeController = null;
  let activeBlobURL = null;
  let loadTimer = null;

  function fail(message) {
    notice.textContent = message;
    notice.hidden = false;
  }

  function getGameId() {
    const namedId = (params.get('game') || params.get('id') || '').trim();
    if (namedId) return namedId;
    const firstPart = (window.location.search || '').slice(1).split('&', 1)[0];
    const compactId = firstPart.split('=', 1)[0].trim();
    if (/^\d+$/.test(compactId)) return compactId;

    // PenguinMod's srcdoc-based extension passes the selected game in iframe.name.
    const embeddedMatch = /^penguinmod-game:(\d+)(?::large=1|:size=(?:small|large|auto))?$/.exec(String(window.name || '').trim());
    return embeddedMatch ? embeddedMatch[1] : null;
  }

  function getBufferMode() {
    const queryMode = String(params.get('size') || '').trim().toLowerCase();
    if (queryMode === 'small' || queryMode === 'large' || queryMode === 'auto') return queryMode;
    if (params.get('large') === '1') return 'large';

    const frameName = String(window.name || '').trim();
    if (/^penguinmod-game:\d+:large=1$/.test(frameName)) return 'large';
    const embeddedMatch = /^penguinmod-game:\d+:size=(small|large|auto)$/.exec(frameName);
    return embeddedMatch ? embeddedMatch[1] : 'small';
  }

  function gameNameFromPath(path) {
    const filename = path.split('/').pop() || path;
    return filename.replace(/\.(?:html|zip)$/i, '').replace(/[-_]+/g, ' ').trim() || filename;
  }

  function gamePolicyFor(game) {
    const path = String(game && game.path || '').split('/').pop().toLowerCase();
    if (['mausland-sharks.html', 'eaglercraft-26.2-0.5.html', 'webdashers.html',
      'get-yoked.html', 'rolling-sky.html', 'super-mario-construct.html'].includes(path)) {
      return Object.freeze({ blobBacked: true, rollingSky: path === 'rolling-sky.html', superMarioConstruct: path === 'super-mario-construct.html' });
    }
    return Object.freeze({ blobBacked: false, rollingSky: false, superMarioConstruct: false });
  }

  function gameURLFromPath(path, ref = REPOSITORY_DEFAULT_REF) {
    const normalizedRef = String(ref || REPOSITORY_DEFAULT_REF).trim();
    const refPath = normalizedRef.startsWith('refs/') || /^[0-9a-f]{40}$/i.test(normalizedRef)
      ? normalizedRef
      : `refs/heads/${normalizedRef.split('/').map(segment => encodeURIComponent(segment)).join('/')}`;
    const encodedPath = String(path).split('/').map(segment => encodeURIComponent(segment)).join('/');
    return `${REPOSITORY_RAW_BASE}/${refPath}/${encodedPath}`;
  }

  async function discoverGameCatalog() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const response = await fetch(REPOSITORY_TREE_API, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'default',
        redirect: 'follow',
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`GitHub catalog returned HTTP ${response.status}.`);
      const repositoryTree = await response.json();
      if (!repositoryTree || repositoryTree.truncated || !Array.isArray(repositoryTree.tree)) {
        throw new Error('GitHub returned an incomplete game catalog.');
      }

      const supportedPaths = new Set(repositoryTree.tree
        .filter(entry => entry && entry.type === 'blob' && typeof entry.path === 'string'
          && entry.path.toLowerCase() !== REMOTE_LAUNCHER_PATH
          && /\.(?:html|zip)$/i.test(entry.path))
        .map(entry => entry.path));
      const htmlPaths = new Set(Array.from(supportedPaths).filter(path => /\.html$/i.test(path)));
      const zipPaths = new Set(Array.from(supportedPaths).filter(path => /\.zip$/i.test(path)));
      const knownPaths = new Set(KNOWN_GAMES.map(game => game.path));
      const catalog = Object.create(null);

      // Fixed HTML IDs 1–15 stay fixed. New HTML files are sorted after them;
      // ZIP archives are appended after HTML so adding a ZIP cannot renumber an
      // existing game or any currently discovered HTML item.
      for (const game of KNOWN_GAMES) {
        if (htmlPaths.has(game.path)) {
          catalog[game.id] = Object.freeze({ name: game.name, path: game.path, type: 'html', url: gameURLFromPath(game.path, game.ref) });
        }
      }
      const additionalHTMLPaths = Array.from(htmlPaths)
        .filter(path => !knownPaths.has(path))
        .sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
      additionalHTMLPaths.forEach((path, index) => {
        const id = String(KNOWN_GAMES.length + index + 1);
        catalog[id] = Object.freeze({ name: gameNameFromPath(path), path, type: 'html', url: gameURLFromPath(path) });
      });
      const additionalZIPPaths = Array.from(zipPaths)
        .sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
      additionalZIPPaths.forEach((path, index) => {
        const id = String(KNOWN_GAMES.length + additionalHTMLPaths.length + index + 1);
        catalog[id] = Object.freeze({ name: `${gameNameFromPath(path)} (ZIP)`, path, type: 'zip', url: gameURLFromPath(path) });
      });
      return Object.freeze(catalog);
    } finally {
      clearTimeout(timeout);
    }
  }

  async function refreshGameCatalog() {
    try {
      GAMES = await discoverGameCatalog();
      return true;
    } catch (_) {
      GAMES = BUILT_IN_GAMES;
      return false;
    }
  }

  function availableGameIds(catalog) {
    return Object.keys(catalog)
      .map(id => Number(id))
      .filter(id => Number.isSafeInteger(id) && id > 0)
      .sort((left, right) => left - right);
  }

  function formatGameIdRanges(ids) {
    const ranges = [];
    let start = ids[0];
    let end = ids[0];
    for (let index = 1; index < ids.length; index++) {
      if (ids[index] === end + 1) {
        end = ids[index];
      } else {
        ranges.push(start === end ? String(start) : `${start}–${end}`);
        start = end = ids[index];
      }
    }
    ranges.push(start === end ? String(start) : `${start}–${end}`);
    return ranges.join(', ');
  }

  function formatSelectionMessage(catalog) {
    const ids = availableGameIds(catalog);
    if (!ids.length) return 'No HTML or ZIP games are currently available in the repository.';
    const countText = `${ids.length} game${ids.length === 1 ? '' : 's'} available`;
    if (String(window.name || '').trim() === 'penguinmod-game:catalog') {
      const rows = Object.keys(catalog)
        .sort((left, right) => Number(left) - Number(right))
        .map(id => `${id}: ${catalog[id].name}`);
      return ['PenguinMod game catalog', '', ...rows, '', 'Enter the ID in open game [ID] with [MODE] buffering.', `(${countText})`].join('\n');
    }
    if (ids[0] === 1 && ids[ids.length - 1] === ids.length) {
      return `Append ?1 through ?${ids[ids.length - 1]} to this URL to select a game (${countText}).`;
    }
    return `Append one of these available IDs (${formatGameIdRanges(ids)}) to this URL to select a game (${countText}).`;
  }

  function formatAvailableIdsMessage(catalog) {
    const ids = availableGameIds(catalog);
    if (!ids.length) return 'No game IDs are currently available.';
    const countText = `${ids.length} game${ids.length === 1 ? '' : 's'}`;
    return `Available IDs: ${formatGameIdRanges(ids)} (${countText}).`;
  }

  function largeGameHint(gameId) {
    const embedded = String(window.name || '').trim().startsWith('penguinmod-game:');
    return embedded
      ? `Use large or auto in the load-game buffering dropdown for files over 32 MiB.`
      : `Reopen this URL as ?${gameId}&large=1 to opt into memory-heavy buffering.`;
  }

  function formatMiB(bytes) {
    return `${(bytes / (1024 * 1024)).toFixed(1)} MiB`;
  }

  const ZIP_MAX_ENTRIES = 10000;
  const ZIP_MAX_CENTRAL_DIRECTORY_BYTES = 32 * 1024 * 1024;
  const ZIP_MAX_TOTAL_UNCOMPRESSED_BYTES = 1024 * 1024 * 1024;
  const ZIP_CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let value = n;
      for (let bit = 0; bit < 8; bit++) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      table[n] = value >>> 0;
    }
    return table;
  })();

  function zipUint64(view, offset, label) {
    if (offset < 0 || offset + 8 > view.byteLength) throw new Error(`ZIP ${label} is truncated.`);
    const value = (BigInt(view.getUint32(offset + 4, true)) << 32n) | BigInt(view.getUint32(offset, true));
    if (value > BigInt(Number.MAX_SAFE_INTEGER)) throw new Error(`ZIP ${label} exceeds this browser's safe size range.`);
    return Number(value);
  }

  function normalizeZipEntryPath(rawPath) {
    if (typeof rawPath !== 'string' || !rawPath || rawPath.includes(String.fromCharCode(0))) throw new Error('ZIP contains an invalid file path.');
    const path = rawPath.replace(/\\/g, '/');
    if (path.startsWith('/') || /^[a-z]:/i.test(path)) throw new Error('ZIP contains an absolute file path.');
    const parts = [];
    for (const part of path.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') throw new Error('ZIP contains a path that escapes its archive.');
      parts.push(part);
    }
    return parts.join('/');
  }

  function zipMimeType(path) {
    const extension = (path.split('.').pop() || '').toLowerCase();
    return ({
      html: 'text/html;charset=utf-8', htm: 'text/html;charset=utf-8',
      css: 'text/css;charset=utf-8', js: 'text/javascript;charset=utf-8', mjs: 'text/javascript;charset=utf-8',
      json: 'application/json;charset=utf-8', webmanifest: 'application/manifest+json;charset=utf-8',
      txt: 'text/plain;charset=utf-8', xml: 'application/xml;charset=utf-8', svg: 'image/svg+xml',
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      avif: 'image/avif', apng: 'image/apng', ico: 'image/x-icon', wasm: 'application/wasm',
      mp3: 'audio/mpeg', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg; codecs=opus',
      wav: 'audio/wav', m4a: 'audio/mp4', flac: 'audio/flac', mp4: 'video/mp4', m4v: 'video/mp4',
      webm: 'video/webm', ogv: 'video/ogg', woff: 'font/woff', woff2: 'font/woff2',
      ttf: 'font/ttf', otf: 'font/otf', pdf: 'application/pdf', bin: 'application/octet-stream',
      dat: 'application/octet-stream', data: 'application/octet-stream'
    })[extension] || 'application/octet-stream';
  }

  async function parseZipArchive(zipBlob) {
    if (!(zipBlob instanceof Blob) || zipBlob.size < 22) throw new Error('The selected ZIP archive is empty or truncated.');
    const tailSize = Math.min(zipBlob.size, 22 + 0xffff);
    const tailStart = zipBlob.size - tailSize;
    const tailBuffer = await zipBlob.slice(tailStart).arrayBuffer();
    const tail = new DataView(tailBuffer);
    let endOffset = -1;
    for (let offset = tail.byteLength - 22; offset >= 0; offset--) {
      if (tail.getUint32(offset, true) !== 0x06054b50) continue;
      const commentLength = tail.getUint16(offset + 20, true);
      if (offset + 22 + commentLength === tail.byteLength) { endOffset = offset; break; }
    }
    if (endOffset < 0) throw new Error('ZIP end record was not found; the archive may be incomplete.');

    const endAbsolute = tailStart + endOffset;
    if (tail.getUint16(endOffset + 4, true) !== 0 || tail.getUint16(endOffset + 6, true) !== 0) {
      throw new Error('Multi-volume ZIP archives are not supported.');
    }
    let entriesOnDisk = tail.getUint16(endOffset + 8, true);
    let entryCount = tail.getUint16(endOffset + 10, true);
    let centralSize = tail.getUint32(endOffset + 12, true);
    let centralOffset = tail.getUint32(endOffset + 16, true);

    if (entryCount === 0xffff || entriesOnDisk === 0xffff || centralSize === 0xffffffff || centralOffset === 0xffffffff) {
      const locatorStart = endAbsolute - 20;
      if (locatorStart < 0) throw new Error('ZIP64 locator is missing.');
      const locatorBuffer = await zipBlob.slice(locatorStart, endAbsolute).arrayBuffer();
      const locator = new DataView(locatorBuffer);
      if (locator.getUint32(0, true) !== 0x07064b50 || locator.getUint32(4, true) !== 0) {
        throw new Error('ZIP64 archives must use a single disk.');
      }
      const zip64Offset = zipUint64(locator, 8, 'ZIP64 directory offset');
      const zip64Buffer = await zipBlob.slice(zip64Offset, zip64Offset + 56).arrayBuffer();
      const zip64 = new DataView(zip64Buffer);
      if (zip64.byteLength < 56 || zip64.getUint32(0, true) !== 0x06064b50) throw new Error('ZIP64 end record is invalid.');
      if (zip64.getUint32(16, true) !== 0 || zip64.getUint32(20, true) !== 0) throw new Error('Multi-volume ZIP64 archives are not supported.');
      entriesOnDisk = zipUint64(zip64, 24, 'per-disk entry count');
      entryCount = zipUint64(zip64, 32, 'entry count');
      centralSize = zipUint64(zip64, 40, 'central directory size');
      centralOffset = zipUint64(zip64, 48, 'central directory offset');
    }
    if (entriesOnDisk !== entryCount) throw new Error('Multi-volume ZIP archives are not supported.');
    if (entryCount > ZIP_MAX_ENTRIES) throw new Error(`ZIP has too many files (${entryCount}; maximum ${ZIP_MAX_ENTRIES}).`);
    if (centralSize > ZIP_MAX_CENTRAL_DIRECTORY_BYTES) throw new Error('ZIP file index is too large to inspect safely.');
    if (centralOffset + centralSize > zipBlob.size) throw new Error('ZIP central directory points outside the archive.');

    const centralBuffer = await zipBlob.slice(centralOffset, centralOffset + centralSize).arrayBuffer();
    const central = new DataView(centralBuffer);
    const decoder = new TextDecoder('utf-8');
    const entries = new Map();
    let totalUncompressedBytes = 0;
    let offset = 0;
    let parsedCount = 0;
    while (parsedCount < entryCount) {
      if (offset + 46 > central.byteLength || central.getUint32(offset, true) !== 0x02014b50) {
        throw new Error('ZIP central directory entry is invalid or truncated.');
      }
      const madeBy = central.getUint8(offset + 5);
      const flags = central.getUint16(offset + 8, true);
      const method = central.getUint16(offset + 10, true);
      const crc32 = central.getUint32(offset + 16, true);
      let compressedSize = central.getUint32(offset + 20, true);
      let uncompressedSize = central.getUint32(offset + 24, true);
      const nameLength = central.getUint16(offset + 28, true);
      const extraLength = central.getUint16(offset + 30, true);
      const commentLength = central.getUint16(offset + 32, true);
      let diskStart = central.getUint16(offset + 34, true);
      const externalAttributes = central.getUint32(offset + 38, true);
      let localHeaderOffset = central.getUint32(offset + 42, true);
      const nameStart = offset + 46;
      const extraStart = nameStart + nameLength;
      const end = extraStart + extraLength + commentLength;
      if (end > central.byteLength) throw new Error('ZIP central directory filename or extra data is truncated.');
      const rawName = decoder.decode(new Uint8Array(centralBuffer, nameStart, nameLength));
      const isDirectory = rawName.endsWith('/') || !!(externalAttributes & 0x10);

      if (compressedSize === 0xffffffff || uncompressedSize === 0xffffffff || localHeaderOffset === 0xffffffff || diskStart === 0xffff) {
        let extraOffset = extraStart;
        let foundZip64 = false;
        while (extraOffset + 4 <= extraStart + extraLength) {
          const tag = central.getUint16(extraOffset, true);
          const length = central.getUint16(extraOffset + 2, true);
          const dataStart = extraOffset + 4;
          const dataEnd = dataStart + length;
          if (dataEnd > extraStart + extraLength) throw new Error('ZIP extra field is truncated.');
          if (tag === 0x0001) {
            foundZip64 = true;
            let cursor = dataStart;
            if (uncompressedSize === 0xffffffff) { uncompressedSize = zipUint64(central, cursor, 'entry size'); cursor += 8; }
            if (compressedSize === 0xffffffff) { compressedSize = zipUint64(central, cursor, 'compressed entry size'); cursor += 8; }
            if (localHeaderOffset === 0xffffffff) { localHeaderOffset = zipUint64(central, cursor, 'local header offset'); cursor += 8; }
            if (diskStart === 0xffff) diskStart = central.getUint32(cursor, true);
            break;
          }
          extraOffset = dataEnd;
        }
        if (!foundZip64) throw new Error('ZIP64 entry is missing its size metadata.');
      }
      if (diskStart !== 0) throw new Error('Multi-volume ZIP entries are not supported.');
      if (flags & 0x2041) throw new Error('Encrypted ZIP entries are not supported.');
      const isUnixSymlink = madeBy === 3 && ((externalAttributes >>> 16) & 0xf000) === 0xa000;
      if (isUnixSymlink) throw new Error('ZIP symbolic links are not allowed.');
      const path = normalizeZipEntryPath(rawName);
      if (!isDirectory && path) {
        if (method !== 0 && method !== 8) throw new Error(`ZIP compression method ${method} is unsupported; use Store or Deflate.`);
        if (entries.has(path)) throw new Error(`ZIP contains a duplicate path: ${path}`);
        if (localHeaderOffset + 30 > zipBlob.size) throw new Error(`ZIP entry points outside the archive: ${path}`);
        totalUncompressedBytes += uncompressedSize;
        if (!Number.isSafeInteger(totalUncompressedBytes)) throw new Error('ZIP expanded size exceeds this browser\'s safe size range.');
        if (totalUncompressedBytes > ZIP_MAX_TOTAL_UNCOMPRESSED_BYTES) {
          throw new Error(`ZIP expands beyond the ${formatMiB(ZIP_MAX_TOTAL_UNCOMPRESSED_BYTES)} safety limit.`);
        }
        entries.set(path, Object.freeze({ path, flags, method, crc32, compressedSize, uncompressedSize, localHeaderOffset, rawName }));
      }
      offset = end;
      parsedCount++;
    }
    if (entries.size === 0) throw new Error('ZIP contains no usable files.');
    return Object.freeze({ entries, totalUncompressedBytes });
  }

  function selectZipHTML(entries) {
    const htmlEntries = Array.from(entries.values()).filter(entry => /\.html?$/i.test(entry.path));
    if (!htmlEntries.length) throw new Error('ZIP has no .html entry point. Add index.html or include exactly one HTML file.');
    const rootIndex = htmlEntries.find(entry => entry.path.toLowerCase() === 'index.html');
    if (rootIndex) return rootIndex.path;
    const indexFiles = htmlEntries.filter(entry => entry.path.split('/').pop().toLowerCase() === 'index.html');
    if (indexFiles.length === 1) return indexFiles[0].path;
    if (indexFiles.length > 1) throw new Error(`ZIP has multiple index.html files: ${indexFiles.slice(0, 5).map(entry => entry.path).join(', ')}`);
    if (htmlEntries.length === 1) return htmlEntries[0].path;
    throw new Error(`ZIP has multiple HTML files and no unique index.html: ${htmlEntries.slice(0, 6).map(entry => entry.path).join(', ')}`);
  }

  async function extractZipEntryBlob(zipBlob, entry, signal) {
    const headerBuffer = await zipBlob.slice(entry.localHeaderOffset, entry.localHeaderOffset + 30).arrayBuffer();
    const header = new DataView(headerBuffer);
    if (header.byteLength < 30 || header.getUint32(0, true) !== 0x04034b50) throw new Error(`ZIP local header is invalid: ${entry.path}`);
    const localFlags = header.getUint16(6, true);
    const localMethod = header.getUint16(8, true);
    const nameLength = header.getUint16(26, true);
    const extraLength = header.getUint16(28, true);
    if (localMethod !== entry.method || ((localFlags | entry.flags) & 0x2041)) throw new Error(`ZIP local header does not match its directory entry: ${entry.path}`);
    const localNameBuffer = await zipBlob.slice(entry.localHeaderOffset + 30, entry.localHeaderOffset + 30 + nameLength).arrayBuffer();
    const localName = new TextDecoder('utf-8').decode(localNameBuffer);
    if (normalizeZipEntryPath(localName) !== entry.path) throw new Error(`ZIP local filename does not match its directory entry: ${entry.path}`);
    const dataStart = entry.localHeaderOffset + 30 + nameLength + extraLength;
    const dataEnd = dataStart + entry.compressedSize;
    if (dataEnd > zipBlob.size) throw new Error(`ZIP entry data is truncated: ${entry.path}`);
    const compressedBlob = zipBlob.slice(dataStart, dataEnd);
    if (entry.method === 0 && entry.compressedSize !== entry.uncompressedSize) throw new Error(`Stored ZIP entry has an invalid size: ${entry.path}`);

    let size = 0;
    let crc = 0xffffffff;
    const verifier = new TransformStream({
      transform(chunk, controller) {
        if (signal && signal.aborted) throw new DOMException('Loading timed out or was cancelled.', 'AbortError');
        const bytes = chunk instanceof Uint8Array ? chunk : new Uint8Array(chunk);
        size += bytes.byteLength;
        if (size > entry.uncompressedSize) throw new Error(`ZIP entry expanded beyond its declared size: ${entry.path}`);
        for (let index = 0; index < bytes.length; index++) crc = ZIP_CRC_TABLE[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
        controller.enqueue(bytes);
      },
      flush() {
        if (signal && signal.aborted) throw new DOMException('Loading timed out or was cancelled.', 'AbortError');
        if (size !== entry.uncompressedSize) throw new Error(`ZIP entry size check failed: ${entry.path}`);
        if (((crc ^ 0xffffffff) >>> 0) !== entry.crc32) throw new Error(`ZIP entry checksum failed: ${entry.path}`);
      }
    });

        : gameId === '3' ? prepareGameThreeUnity(sourceHTML)
          : gameId === '7' ? prepareGameSeven(sourceHTML)
            : gameId === '8' ? prepareGameEight(sourceHTML) : sourceHTML;
      const cleanedSource = stripCloudflareScripts(preparedSource);
      const unwrappedHTML = gameId === '1' ? null : extractCDATAHTMLFromScriptWrapper(cleanedSource);
      const baseHTML = addBaseForNormalHTML(unwrappedHTML || cleanedSource, sourceBaseURL);
      const cookieHTML = addMemoryCookieShim(baseHTML, gameId);
      const html = addMemoryStorageShim(cookieHTML, gameId);
      gameFrame.srcdoc = html;
      document.title = `${game.name} — Game`;
    } catch (error) {
      const message = error && error.name === 'AbortError'
        ? 'Loading timed out or was cancelled.'
        : (error && error.message ? error.message : String(error));
      fail(`Game ${gameId} could not be loaded.\n${message}`);
    } finally {
      if (loadTimer) clearTimeout(loadTimer);
      loadTimer = null;
      activeController = null;

  window.addEventListener('message', event => {
    const session = activeZipSession;
    const data = event.data;
    if (!session || event.source !== gameFrame.contentWindow || !data || data.token !== session.token) return;
    if (data.type === 'pmzip-ready' && !session.sent) {
      session.sent = true;
      try {
        event.source.postMessage({
          type: 'pmzip-init',
          token: session.token,
          entryPath: session.entryPath,
          files: session.files
        }, '*');
        session.files = null;
      } catch (error) {
        if (session.timer) clearTimeout(session.timer);
        activeZipSession = null;
        fail(`ZIP game ${session.gameId} could not pass its assets to the sandbox.\n${error && error.message ? error.message : error}`);
      }
    } else if (data.type === 'pmzip-error') {
      if (session.timer) clearTimeout(session.timer);
      activeZipSession = null;
      fail(`ZIP game ${session.gameId} could not be loaded.\n${data.message || 'The archive bootstrap failed.'}`);
    } else if (data.type === 'pmzip-started') {
      if (session.timer) clearTimeout(session.timer);
      activeZipSession = null;
      notice.hidden = true;
      document.title = `${session.gameName} — Game`;
    }
  });
  window.addEventListener('pagehide', () => {
    if (activeController) activeController.abort();
    if (activeZipSession && activeZipSession.timer) clearTimeout(activeZipSession.timer);
    activeZipSession = null;
    if (activeBlobURL) {
      URL.revokeObjectURL(activeBlobURL);
      activeBlobURL = null;
    }
  });

  async function initializeLoader() {
    const gameId = getGameId();
    if (!gameId) {
      fail('Checking the repository game catalog…');
      const refreshed = await refreshGameCatalog();
      const message = formatSelectionMessage(GAMES);
      fail(refreshed ? message : `${message}\nRepository catalog could not be refreshed; using the built-in list.`);
      return;
    }

    // The established IDs load immediately, preserving their existing behavior.
    // Only an empty or not-yet-known selection needs the live repository listing.
    if (GAMES[gameId]) {
      loadGame(gameId, GAMES[gameId]);
      return;
    }

    fail('Checking the repository game catalog…');
    const refreshed = await refreshGameCatalog();
    if (GAMES[gameId]) {
      loadGame(gameId, GAMES[gameId]);
      return;
    }
    const suffix = refreshed ? '' : '\nRepository catalog could not be refreshed; using the built-in list.';
    fail(`Game ${gameId} is not configured. ${formatAvailableIdsMessage(GAMES)}${suffix}`);
  }

  initializeLoader();
})();
